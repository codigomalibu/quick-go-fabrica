<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quick Go Fábrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Montserrat:wght@500;600;700&family=Anek+Devanagari:wght@300;400;500;600&display=swap">
<style>body{margin:0;font-size:14px;-webkit-font-smoothing:antialiased}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: faixa Azul Petróleo com logo e navegação fina; papel linho de fundo; títulos finos em serifa display; fotos dos itens em todas as listas */
:root{
  --petroleo:#22343b; --platina:#d9d9d9; --linho:#faf0e6;
  --mineral:#6f9ca7; --nevoa:#a9cad5; --ambar:#d79a45; --lavanda:#6e7fb8; --lilas:#a77fa5; --pessego:#e6a58f;
  --bg:#f5ede2; --paper:url("https://static.wixstatic.com/media/42aab8_387e42f344fc45e6ba8e836c34c67040~mv2.jpg"); --surface:#fcf8f2; --surface-2:#f1e9dd; --line:#ddd2c2; --ink:#22343b; --muted:#5f6d71; --accent:#a9712a; --photo-bg:#ffffff;
  --ok:#2f7a57; --warn:#a9712a; --bad:#b4483c; --ok-bg:#e1eee5; --warn-bg:#f6e6cc; --bad-bg:#f6e0dc; --info-bg:#e1edf0;
  --display:"Italiana","Didot","Bodoni 72",Georgia,serif; --sub:"Montserrat",system-ui,sans-serif; --body:"Anek Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#132027; --paper:none; --surface:#1a2a31; --surface-2:#21343c; --line:#2e4650; --ink:#faf0e6; --muted:#a8b8bc; --accent:#e3ad62; --photo-bg:#f4efe8;
  --ok:#7cc59d; --warn:#e3ad62; --bad:#ec8f82; --ok-bg:#183a2d; --warn-bg:#3a2c13; --bad-bg:#3e1f1b; --info-bg:#173640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#132027; --paper:none; --surface:#1a2a31; --surface-2:#21343c; --line:#2e4650; --ink:#faf0e6; --muted:#a8b8bc; --accent:#e3ad62; --photo-bg:#f4efe8;
  --ok:#7cc59d; --warn:#e3ad62; --bad:#ec8f82; --ok-bg:#183a2d; --warn-bg:#3a2c13; --bad-bg:#3e1f1b; --info-bg:#173640; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg) var(--paper);background-size:700px auto;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--petroleo)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--petroleo);color:var(--linho);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:18px;padding-block:16px 6px;flex-wrap:wrap}
.brand img{height:34px;width:auto;display:block}
.brand .tag{font-family:var(--sub);font-size:10.5px;text-transform:uppercase;letter-spacing:.22em;color:var(--nevoa);border-left:1px solid rgba(250,240,230,.25);padding-left:18px}
.brand .sp{flex:1}
.brand .who{font-size:13px;color:rgba(250,240,230,.7)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:rgba(250,240,230,.72);text-decoration:none;padding:12px 12px 13px;font-family:var(--sub);font-weight:500;font-size:12px;letter-spacing:.06em;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs a:hover{color:var(--linho)}
nav.tabs a.on{color:var(--linho);border-bottom-color:var(--ambar)}
main{padding-block:28px 72px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em;line-height:1.05}
h1{font-size:46px}
h2{font-size:30px}
h3{font-size:23px}
.eyebrow{font-family:var(--sub);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--accent)}
.lead{color:var(--muted);max-width:66ch;margin:8px 0 0;font-size:16px;font-weight:300}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
/* Painel integrado: rosca da frota, quadro da fábrica, fluxo da montagem, barras e cronograma das praças */
.ink{color:var(--ink)}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:16px;margin-bottom:22px}
.dash .panel{display:flex;flex-direction:column}
.ph2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.ph2 h3{font-size:25px}
.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dnut{width:128px;height:128px;flex:none}
.dnut .dn-v{font-family:var(--display);font-size:30px;fill:var(--ink)}
.dnut .dn-l{font-family:var(--sub);font-size:8px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;fill:var(--muted)}
.lg2{display:grid;gap:4px;font-size:13px;flex:1;min-width:150px}
.lg2 span{display:flex;align-items:center;gap:7px}
.lg2 i{width:10px;height:10px;border-radius:50%;flex:none}
.lg2 b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px}
.lane{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.lane h4{margin:0;font-family:var(--sub);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lane h4 b{font-family:var(--display);font-size:30px;color:var(--ink);letter-spacing:0;font-weight:400;line-height:1}
.chipm{display:flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--surface-2);min-width:0;color:var(--ink);text-decoration:none}
.chipm:hover{border-color:var(--c)}
.chipm i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.chipm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.chipm small{margin-left:auto;color:var(--muted);white-space:nowrap;font-size:11.5px}
.row .chipm{flex:none}
.lbl2{font-family:var(--sub);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.lbl2:first-child{margin-top:0}
.flow{display:flex;align-items:stretch}
.flow .st{flex:1;min-width:0;text-align:center;padding:10px 4px;border:1px solid var(--line);background:var(--surface-2);position:relative}
.flow .st+.st{border-left:0}
.flow .st:first-child{border-radius:var(--r) 0 0 var(--r)}
.flow .st:last-child{border-radius:0 var(--r) var(--r) 0}
.flow .st b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-weight:400}
.flow .st span{display:block;font-family:var(--sub);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.flow .st:not(:last-child)::after{content:"";position:absolute;right:-6px;top:50%;width:10px;height:10px;transform:translateY(-50%) rotate(45deg);border-top:1px solid var(--line);border-right:1px solid var(--line);background:var(--surface-2);z-index:1}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,110px) 34px;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.hbar>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.hbar .tr span{display:block;height:100%;background:var(--mineral)}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.prog{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:flex}
.prog span{display:block;height:100%}
.pp{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.pp:last-child{border-bottom:0}
.gantt{position:relative}
.gantt i{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);border-radius:1px;transform:translateX(-1px)}
.tline{display:grid;grid-template-columns:auto auto 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.tline:last-child{border-bottom:0}
.tline>span:nth-child(3){grid-column:1/-1}
.tline>span:nth-child(4){grid-column:1/-1;color:var(--mineral)}
.alertline{padding:9px 12px;border-radius:var(--r);background:var(--bad-bg);color:var(--bad);font-size:13.5px;font-weight:500}
@media (max-width:700px){.flow .st b{font-size:24px}.lane h4 b{font-size:26px}.dnut{width:112px;height:112px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.stat .lbl{font-family:var(--sub);font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);font-weight:600}
.stat .val{font-family:var(--display);font-size:36px;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1}
.stat .sub{font-size:13px;color:var(--muted);margin-top:4px}
.hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:300px;display:flex;align-items:flex-end;background:#0e171b url("https://static.wixstatic.com/media/42aab8_3ce6f52fe0344be1bd8592cd5b844ab7~mv2.jpg") center/cover no-repeat;color:var(--linho);margin-bottom:22px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,30,35,.92) 0%,rgba(18,30,35,.6) 45%,rgba(18,30,35,0) 75%)}
.hero .in{position:relative;z-index:1;padding:34px 32px;max-width:560px}
.hero h1{font-size:54px;color:var(--linho)}
.hero p{color:rgba(250,240,230,.82);font-weight:300;font-size:16px;margin:10px 0 18px}
.hero .eyebrow{color:var(--ambar)}
.mcard{display:grid;grid-template-columns:170px 1fr;gap:20px;padding:0;overflow:hidden}
.mcard .ph{background:#0e171b center/cover no-repeat;min-height:240px}
.mcard .bd{padding:20px 20px 20px 0;min-width:0}
.btn{font:inherit;font-family:var(--sub);font-weight:600;font-size:12px;letter-spacing:.05em;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:var(--r);cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--mineral)}
.btn.pri{background:var(--petroleo);border-color:var(--petroleo);color:var(--linho)}
.btn.pri:hover{background:#2c434b}
.btn.amb{background:var(--ambar);border-color:var(--ambar);color:#1f1608}
.btn.sm{padding:5px 9px;font-size:11px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:root:not([data-theme="light"]) .btn.pri{border-color:var(--line)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.card:focus-visible{outline:2px solid var(--mineral);outline-offset:2px}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0}
textarea{min-height:64px;width:100%}
label.f{display:flex;flex-direction:column;gap:5px;font-family:var(--sub);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{font-family:var(--body);letter-spacing:0;text-transform:none;font-weight:400}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{font-family:var(--sub);font-size:11.5px;letter-spacing:.06em;font-weight:600;border:0;background:transparent;color:var(--muted);padding:9px 14px;cursor:pointer}
.seg button.on{background:var(--petroleo);color:var(--linho)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-family:var(--sub);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600;padding:11px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.ph{width:56px;padding:5px 6px 5px 10px}
.thumb{width:44px;height:44px;border-radius:3px;background:var(--photo-bg) center/contain no-repeat;border:1px solid var(--line);display:block}
.thumb.lg{width:64px;height:64px}
.thumb.none{display:grid;place-items:center;font-family:var(--sub);font-size:9px;color:#8a8f90;letter-spacing:.06em}
.code{font-family:var(--mono);font-size:12px;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-block;font-family:var(--sub);font-size:10px;font-weight:600;letter-spacing:.06em;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-info{background:var(--info-bg);color:var(--mineral)}
.p-neu{background:var(--surface-2);color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;padding:0}
.card:hover{border-color:var(--mineral)}
.card .img{aspect-ratio:1/1;background:var(--photo-bg) center/contain no-repeat;border-bottom:1px solid var(--line);max-width:100%}
.card .img.none{display:grid;place-items:center;font-family:var(--display);font-size:28px;color:#8a8f90}
.card .bd{padding:12px 13px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .nm{font-weight:500;line-height:1.25;font-size:14.5px}
.card .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;gap:6px}
.card .pr{font-family:var(--display);font-size:20px}
.tree{list-style:none;margin:0;padding:0}
.node{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:10px}
.node .nimg{width:96px;height:96px;border-radius:3px;background:var(--photo-bg) center/contain no-repeat;border:1px solid var(--line)}
.node .nimg.cover{background-size:cover}
.node .nimg.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);overflow:hidden}
.node .nimg.mosaic span{background:var(--photo-bg) center/contain no-repeat}
.node .nm{font-family:var(--display);font-size:21px;line-height:1.1;margin-top:2px}
.node>div{min-width:0}
.node .act{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tree .tree{padding-left:26px;border-left:1px solid var(--line);margin-left:47px}
details.parts>summary{cursor:pointer;color:var(--mineral);font-family:var(--sub);font-size:11px;letter-spacing:.06em;font-weight:600;padding-top:6px}
.counter{display:inline-flex;align-items:center;gap:6px}
.counter b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:color-mix(in srgb,var(--surface) 60%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--petroleo);color:var(--linho);padding:11px 18px;border-radius:var(--r);font-family:var(--sub);font-size:12px;font-weight:600;letter-spacing:.04em;z-index:50;box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast.err{background:var(--bad)}
.scrim{position:fixed;inset:0;background:rgba(14,23,27,.55);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg) var(--paper);background-size:700px auto;width:min(600px,100%);height:100%;overflow-y:auto;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 20px;border-left:1px solid var(--line)}
.drawer .fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.drawer .fg .full{grid-column:1/-1}
.drawer .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.drawer .photo{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;margin-top:14px}
.drawer .photo .thumb{width:150px;height:150px}
.gantt{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;align-items:center;font-size:13px}
.gantt .track{position:relative;height:28px;background:var(--surface-2);border-radius:3px}
.gantt .gseg{position:absolute;top:4px;bottom:4px;border-radius:2px;display:flex;align-items:center;padding:0 8px;color:#fff;font-family:var(--sub);font-weight:600;font-size:10.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.gantt .lbl{font-weight:500}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);grid-column:2}
.deliver{display:flex;gap:26px;align-items:center;flex-wrap:wrap;background:var(--petroleo) url("https://static.wixstatic.com/media/42aab8_c6849ebfdce84c949dd77cd9071fb08f~mv2.jpg") right center/auto 100% no-repeat;color:var(--linho);border-radius:var(--r);padding:22px 24px;position:relative;overflow:hidden}
.deliver::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--petroleo) 55%,rgba(34,52,59,.55))}
.deliver>*{position:relative}
.deliver .big{font-family:var(--display);font-size:42px;line-height:1}
.deliver .k{font-family:var(--sub);font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--nevoa);margin-bottom:4px}
.combo{display:flex;gap:12px;flex-wrap:wrap}
.combo .unit{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 10px 10px;background:var(--surface);display:flex;gap:12px;align-items:center;flex:1;min-width:220px}
.combo .unit .uimg{width:58px;height:78px;border-radius:3px;background:#0e171b center/cover no-repeat;flex:none}
.combo .unit .q{font-family:var(--display);font-size:34px;line-height:1}
.notice{background:var(--info-bg);color:var(--ink);border-radius:var(--r);padding:11px 14px;font-size:14px}
.sec{margin-top:30px}
.sech{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
a.lk{color:var(--mineral);text-decoration:none;font-weight:500}
a.lk:hover{text-decoration:underline}
.explode{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.explode figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:zoom-in}
.explode figure img{width:100%;height:170px;object-fit:contain;display:block}
.explode figcaption{font-family:var(--sub);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#22343b;margin-top:6px;font-weight:600}
.lightbox{position:fixed;inset:0;background:rgba(14,23,27,.88);z-index:60;display:grid;place-items:center;padding:24px;cursor:zoom-out}

function histOf(id) { const h = (S.precos[id] && S.precos[id].historico) || []; return [...h].sort((a, b) => String(a.d).localeCompare(String(b.d))); }
function priceAt(id, d) { const h = histOf(id); if (!h.length) return num(S.precos[id]?.custo); let v = num(h[0].v); for (const e of h) { if (e.d <= d) v = num(e.v); else break; } return v; }
function custoModelo(m) {
  const c = cfg(); const porGrupo = {}; const porTipo = { peca: 0, peca_pronta: 0, acessorio: 0 }; let total = 0; const linhas = [];
  for (const it of itemsArr()) {
    const q = qtyOf(it, m); if (!q) continue;
    const v = q * num(it.custo); total += v;
    porGrupo[it.grupo || "Outros"] = (porGrupo[it.grupo || "Outros"] || 0) + v;
    porTipo[it.tipo] = (porTipo[it.tipo] || 0) + v;
    linhas.push({ ...it, q, v });
  }
  const mo = num(c.maoObra[m]);
  if (mo) porGrupo["Mão de obra"] = mo;
  return { total: total + mo, pecas: total, mo, porGrupo, porTipo, linhas: linhas.sort((a, b) => b.v - a.v) };
}
function serieModelo(m) {
  const dates = new Set([today()]);
  for (const id of Object.keys(S.precos)) for (const e of histOf(id)) if (e.d) dates.add(e.d);
  const its = itemsArr().filter((i) => qtyOf(i, m));
  const mo = num(cfg().maoObra[m]);

}

  if (num(novo) !== old) h.push({ d: today(), v: num(novo), ant: old, o: origem });

  const fr = Object.values(S.pracas).filter((p) => p.expedidaEm && p.entregueEm).sort((a, b) => String(b.entregueEm).localeCompare(String(a.entregueEm))).slice(0, 5);
  out.frete = fr.length ? { v: Math.round(fr.reduce((s, p) => s + Math.max(0, diffDays(p.expedidaEm, p.entregueEm)), 0) / fr.length), n: fr.length } : null;

function temposSugeridos() { const c = cfg(); const s = sugestao(); return { carcaca: s.carcaca ? s.carcaca.v : c.tempos.carcaca, eletronica: s.eletronica ? s.eletronica.v : c.tempos.eletronica, montagem: s.montagem ? s.montagem.v : c.tempos.montagem, frete: s.frete ? s.frete.v : c.frete, s }; }

// ---------- plano da praça ----------
function planOne(p, stock, ms) {
  const c = cfg(); const req = {}; const steps = {};
  const add = (id, q) => { if (q > 0) req[id] = (req[id] || 0) + q; };
  const its = itemsArr();
  for (const m of MODELS) {
    const n = Math.max(0, Math.round(num(p.qtd && p.qtd[m])));
    const a = Math.min(n, Math.max(0, ms[m].maquina)); ms[m].maquina -= a; const n1 = n - a;
    const b = Math.min(n1, Math.max(0, ms[m].acabado)); ms[m].acabado -= b; const n2 = n1 - b;
    const build = {}; const semiUsed = {};
    for (const it of its) if (it.tipo === "acessorio") add(it.id, qtyOf(it, m) * n1);
    for (const k of Object.keys(CONJ)) {
      const s = Math.min(n2, Math.max(0, ms[m][k] || 0)); ms[m][k] -= s; semiUsed[k] = s; build[k] = n2 - s;
      for (const it of its) if (it.tipo !== "acessorio" && it.conjunto === k) add(it.id, qtyOf(it, m) * build[k]);
    }
    for (const it of its) if (it.tipo !== "acessorio" && !CONJ[it.conjunto]) add(it.id, qtyOf(it, m) * n2);
    steps[m] = { n, prontas: a, acabados: b, embalar: n1, montar: n2, build, semiUsed };
  }
  const inicio = p.dataInicio || today();
  const comprasP = Object.entries(S.compras).map(([id, v]) => ({ id, ...v })).filter((x) => x.pracaId === p.id && x.status !== "cancelado");
  const linhas = [];
  for (const [id, need] of Object.entries(req)) {
    const it = itemOf(id); if (!it) continue;
    const have = Math.min(need, Math.max(0, stock[id] || 0)); stock[id] = (stock[id] || 0) - have;
    const falta = need - have;
    const cp = comprasP.filter((x) => x.itemId === id && x.status !== "recebido");
    const previsaoCompra = cp.length ? maxD(...cp.map((x) => x.previsao || addDays(inicio, it.prazo, false))) : null;
    const acao = falta <= 0 ? "estoque" : it.tipo === "peca" ? "fabricar" : "comprar";
    const previsao = acao === "comprar" ? (previsaoCompra || addDays(inicio, num(it.prazo), false)) : null;
    linhas.push({ id, it, need, have, falta, acao, previsao, pedido: cp.length > 0, pedidoStatus: cp.map((x) => x.status) });
  }
  linhas.sort((a, b) => (a.it.grupo || "").localeCompare(b.it.grupo || "") || (a.it.codigo || "").localeCompare(b.it.codigo || ""));
  const comprar = linhas.filter((l) => l.acao === "comprar");
  const chegada = comprar.length ? maxD(...comprar.map((l) => l.previsao)) : inicio;
  const t = { carcaca: num(p.tempos?.carcaca ?? c.tempos.carcaca), eletronica: num(p.tempos?.eletronica ?? c.tempos.eletronica), montagem: num(p.tempos?.montagem ?? c.tempos.montagem) };
  const frete = num(p.frete ?? c.frete); const sim = Math.max(1, Math.round(num(p.simult ?? c.simult) || 1)); const uteis = p.diasUteis ?? c.diasUteis;
  const uM = MODELS.reduce((s, m) => s + steps[m].montar, 0);
  const uC = MODELS.reduce((s, m) => s + steps[m].build.principal, 0);
  const uE = MODELS.reduce((s, m) => s + steps[m].build.frontal, 0);
  const dur = (u, d) => u > 0 ? Math.ceil((u / sim) * d) : 0;
  const carcIni = inicio, carcFim = addDays(carcIni, dur(uC, t.carcaca), uteis);
  const eletIni = chegada, eletFim = addDays(eletIni, dur(uE, t.eletronica), uteis);
  const montIni = maxD(carcFim, eletFim, chegada), montFim = addDays(montIni, dur(uM, t.montagem), uteis);
  const freteIni = montFim, entrega = addDays(freteIni, frete, false);
  const fases = [
    { nome: "Chegada das peças compradas", ini: inicio, fim: chegada, cor: "#6f9ca7", info: comprar.length ? comprar.length + " itens a comprar" : "Tudo em estoque" },
    { nome: "Fabricação da carcaça", ini: carcIni, fim: carcFim, cor: "#d79a45", info: uC + " un × " + fmtN(t.carcaca) + " d" },
    { nome: "Montagem eletrônica", ini: eletIni, fim: eletFim, cor: "#6e7fb8", info: uE + " un × " + fmtN(t.eletronica) + " d" },
    { nome: "Montagem da máquina", ini: montIni, fim: montFim, cor: "#22343b", info: uM + " un × " + fmtN(t.montagem) + " d" },
    { nome: "Frete até o franqueado", ini: freteIni, fim: entrega, cor: "#a77fa5", info: fmtN(frete) + " dias corridos" },
  ];
  const custoCompra = comprar.reduce((s, l) => s + l.falta * num(l.it.custo), 0);
  const custoTotal = MODELS.reduce((s, m) => s + steps[m].n * custoModelo(m).total, 0);
  return { steps, linhas, comprar, estoque: linhas.filter((l) => l.have > 0), fabricar: linhas.filter((l) => l.acao === "fabricar"), chegada, entrega, fases, inicio, custoCompra, custoTotal, t, frete, sim, uteis };
}
function allPlans() {
  const stock = {}; for (const [id, it] of Object.entries(S.itens)) stock[id] = Math.max(0, num(it.estoque));
  const ms = mont(); const plans = {};
  const list = Object.entries(S.pracas).map(([id, v]) => ({ id, ...v })).sort((a, b) => String(a.criadoEm || "").localeCompare(String(b.criadoEm || "")));
  for (const p of list) {

    plans[p.id] = ativa ? planOne(p, stock, ms) : planOne(p, { ...stock }, JSON.parse(JSON.stringify(ms)));
    plans[p.id].ativa = ativa;
  }
  return plans;
}

          <ul class="tree">${Object.entries(CONJ).map(([k, v]) => `<li><div class="node"><div class="nimg" data-zoom="${v.img}" style="background-image:url('${v.img}');cursor:zoom-in"></div><div><div class="eyebrow">Produto semiacabado</div><div class="nm">${esc(v.nome)}</div><div class="muted small">${esc(v.fn)}</div>${plist(parts(k))}</div><div class="act">${val(sum(parts(k)))}${ctr(k)}${prod(k, "Produzir 1")}</div></div></li>`).join("")}</ul>

function lineChart(series) {
  const Wd = 640, H = 220, L = 70, R = 16, T = 14, B = 28;
  const all = series.flatMap((s) => s.pts);
  if (!all.length) return "";
  const dates = [...new Set(all.map((p) => p.d))].sort();
  let lo = Math.min(...all.map((p) => p.v)), hi = Math.max(...all.map((p) => p.v));
  if (hi - lo < 1) { lo = lo * 0.95; hi = hi * 1.05 || 1; } else { const pd = (hi - lo) * 0.15; lo -= pd; hi += pd; }
  const x = (d) => dates.length === 1 ? (L + Wd - R) / 2 : L + (dates.indexOf(d) / (dates.length - 1)) * (Wd - L - R);
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = [0, 1, 2, 3].map((k) => lo + ((hi - lo) * k) / 3);
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Custo por máquina ao longo do tempo">
    <g class="grid">${ticks.map((t) => `<line x1="${L}" x2="${Wd - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 3}" text-anchor="end">${Math.round(t).toLocaleString("pt-BR")}</text>`).join("")}</g>
    <text x="${L}" y="${H - 8}">${fmtDs(dates[0])}</text>${dates.length > 1 ? `<text x="${Wd - R}" y="${H - 8}" text-anchor="end">${fmtDs(dates[dates.length - 1])}</text>` : ""}
    ${series.map((s) => `<polyline fill="none" stroke="${s.cor}" stroke-width="2.2" points="${s.pts.map((p) => x(p.d) + "," + y(p.v)).join(" ")}"/>${s.pts.map((p, i) => `<circle cx="${x(p.d)}" cy="${y(p.v)}" r="${i === s.pts.length - 1 ? 4 : 2.5}" fill="${s.cor}"><title>${s.nome} ${fmtDs(p.d)}: ${brl(p.v)}</title></circle>`).join("")}`).join("")}
  </svg><div class="legend">${series.map((s) => `<span><i style="background:${s.cor}"></i>${s.nome} · ${brl(s.pts[s.pts.length - 1].v)}</span>`).join("")}</div>`;
}

  <div class="sec"><div class="sech"><h2>Lista de materiais · ${MODEL_NAME[m]}</h2></div>

document.addEventListener("submit", async (e) => {

  e.preventDefault();

  const id = f.dataset.id || email.replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  if (!f.dataset.id && S.usuarios[id]) { toast("Esse e-mail já está cadastrado.", true); return; }
  const dados = { ...(S.usuarios[id] || {}), nome: $("#us-nome").value.trim(), email, perfil: $("#us-perfil").value === "admin" ? "admin" : "tecnico", ativo: $("#us-ativo").value === "1" };

document.addEventListener("click", (e) => {
  if (e.target.closest("[data-novousr]")) return usrDrawer(null);

  if (d) { const id = d.dataset.delusr; return confirmDrawer("Excluir usuário", `${esc((S.usuarios[id] || {}).email || "")} deixa de entrar com o Google.`, "Excluir", () => guard(() => S.db.collection("usuarios").doc(id).delete(), "Usuário excluído")); }
  const u = e.target.closest("[data-usr]"); if (u) return usrDrawer(u.dataset.usr);
});

// ---------- frota integrada: reparos, o que a fábrica está fazendo e painel geral ----------
const FROTA_ST = { operando: ["Operando", "#4fae7f"], manutencao: ["Em reparo", "#e0604f"], acabamento: ["Ajuste de acabamento", "#e0a24a"], faltando: ["Falta entregar", "#e89a82"], a_produzir: ["A produzir", "#8494d4"], producao: ["Em produção", "#5aa6ba"], envio: ["Em envio", "#b98bb6"], devolucao: ["Devolução", "#8e9799"], aguardando: ["Aguardando compra", "#a9cad5"] };
const MOTIVOS = { peca: "Peça com defeito", eletrica: "Falha elétrica ou eletrônica", hidraulica: "Vazamento ou hidráulica", software: "Tela ou software", acabamento: "Acabamento ou estrutura", desgaste: "Desgaste de uso", mau_uso: "Mau uso ou acidente", outro: "Outro" };
const VIAS = { tecnico: ["Técnico homologado", "#6e7fb8"], fabrica: ["Reparo na fábrica", "#d79a45"] };
const semAcentoId = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]/g, "");
function idMaq(id, m) {

}
const frotaArr = () => Object.entries(S.fm).map(([id, v]) => ({ id, ...v, nomeId: idMaq(id, v), unNome: (S.fu[v.unidade] && S.fu[v.unidade].nome) || "Fábrica" }));
// Todas as peças que saíram do estoque em reparos (abertos e concluídos)
function pecasReparo() {
  const out = [];
  for (const m of frotaArr()) {
    const rs = [...(m.reparos || []), ...(m.status === "manutencao" && m.reparo ? [m.reparo] : [])];
    for (const r of rs) for (const p of r.pecas || []) if (p.baixada) out.push({ ...p, data: p.baixadaEm || r.aberto || "", maquina: m.nomeId, unidade: m.unNome, via: r.via, problema: r.problema, aberto: !r.fechado });

}
const diasAtras = (n) => iso(new Date(Date.now() - n * 864e5));
function usoReparos(dias) {
  const lim = diasAtras(dias); const o = {};
  for (const p of pecasReparo()) if (!p.data || p.data >= lim) o[p.id] = (o[p.id] || 0) + num(p.qtd);
  return o;
}
function donut(parts, label) {

  return `<svg class="dnut" viewBox="0 0 132 132" role="img" aria-label="${esc(label)}: ${tot}"><g transform="rotate(-90 66 66)"><circle r="${r}" cx="66" cy="66" fill="none" stroke="var(--surface-2)" stroke-width="20"/>${segs}</g><text x="66" y="66" text-anchor="middle" class="dn-v">${tot}</text><text x="66" y="84" text-anchor="middle" class="dn-l">${esc(label)}</text></svg>`;
}
const curto = (s, n = 34) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s; };
const chipMaq = (m, cor, extra) => `<a class="chipm" href="#frota" style="--c:${cor}" title="${esc(m.nomeId + " · " + m.unNome + (m.reparo ? " · " + m.reparo.problema : ""))}"><i></i><span>${esc(m.nomeId)}</span>${extra ? `<small>${extra}</small>` : ""}</a>`;

const PRACA_ATIVA = (p) => !p.baixado && !["cancelada", "expedida", "entregue"].includes(p.status);
function baseLivre(descontar) {
  const stock = {}; for (const [id, it] of Object.entries(S.itens)) stock[id] = Math.max(0, num(it.estoque));
  const ms = mont();
  if (descontar) Object.entries(S.pracas).map(([id, v]) => ({ id, ...v })).filter(PRACA_ATIVA)
    .sort((a, b) => String(a.criadoEm || "").localeCompare(String(b.criadoEm || ""))).forEach((p) => planOne(p, stock, ms));

}
const simPlano = (qtd, b) => planOne({ id: "_int", qtd, dataInicio: today() }, { ...b.stock }, JSON.parse(JSON.stringify(b.ms)));

function capacidade(qtdDe, b, fabricando) {
  const faltas = (n) => simPlano(qtdDe(n), b).linhas.filter((l) => l.falta > 1e-9 && !(fabricando && l.acao === "fabricar"));
  const ok = (n) => !faltas(n).length;
  let lo = 0, hi = 1;
  while (hi <= 4096 && ok(hi)) { lo = hi; hi *= 2; }
  if (hi > 4096) return { n: lo, falta: [] };
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (ok(mid)) lo = mid; else hi = mid; }
  return { n: lo, falta: faltas(lo + 1) };
}
function intCalc() {

  const mi = Math.max(0, Math.floor(num(UI.intMini))), te = Math.max(0, Math.floor(num(UI.intTech)));
  const pl = mi + te ? simPlano({ MINI: mi, TECH: te }, b) : null;
  const pedidoAvulso = (id) => Object.values(S.compras).filter((x) => x.itemId === id && !x.pracaId && (x.status === "pendente" || x.status === "pedido")).reduce((s, x) => s + num(x.qtd), 0);
  const comprar = pl ? pl.linhas.filter((l) => l.acao === "comprar").map((l) => { const precisa = Math.ceil(l.falta - 1e-9); const ped = pedidoAvulso(l.id); return { ...l, precisa, ped, qtd: Math.max(0, precisa - ped) }; }) : [];

  const aComprar = comprar.filter((l) => l.qtd > 0);
  return { ativas, desc, b, mi, te, pl, comprar, fabricar, aComprar, custo: aComprar.reduce((s, l) => s + l.qtd * num(l.it.custo), 0) };
}

  const adm = ADM(); const c = cfg(); const plans = allPlans();
  const list = Object.entries(S.pracas).map(([id, v]) => ({ id, ...v })).filter((p) => adm || emAndamento(p)).sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm)));
  const tabela = list.length ? `<div class="tw"><table><thead><tr><th>Praça</th><th>Franqueado</th><th>Máquinas</th><th>Status</th><th>Solicitada</th><th>Peças chegam</th><th>Entrega prevista</th>${adm ? "<th>Entrega real</th>" : ""}</tr></thead><tbody>${list.map((p) => { const pl = plans[p.id]; const st = STATUS_PRACA[p.status] || STATUS_PRACA.planejamento; const real = p.entregueEm && p.dataInicio ? diffDays(p.dataInicio, p.entregueEm) : null; const prev = p.previstaInicial && p.dataInicio ? diffDays(p.dataInicio, p.previstaInicial) : null; return `<tr class="click" data-go="#pracas-p-${p.id}"><td><b>${esc(p.cidade)}</b></td><td>${esc(p.franqueado || "—")}</td><td class="small">${MODELS.map((m) => num(p.qtd?.[m]) + " " + MODEL_NAME[m]).join(" + ")}</td><td><span class="pill ${st[1]}">${st[0]}</span></td><td class="small">${fmtDs(p.criadoEm?.slice(0, 10))}</td><td>${fmtD(pl.chegada)}</td><td><b>${fmtD(pl.entrega)}</b></td>${adm ? `<td class="small">${real !== null ? `${fmtD(p.entregueEm)} · ${real} d${prev !== null ? ` <span class="${real > prev ? "up" : "down"}">(${real - prev >= 0 ? "+" : ""}${real - prev} d)</span>` : ""}` : "—"}</td>` : ""}</tr>`; }).join("")}</tbody></table></div>` : `<div class="empty">Nenhuma praça ${adm ? "solicitada" : "em andamento"} ainda.</div>`;
  if (!adm) return `<div class="head"><div><div class="eyebrow">Produção</div><h1>Praças em andamento</h1><p class="lead">Praças com máquinas em produção e a data prevista de entrega de cada uma.</p></div></div>${tabela}`;
  const ts = temposSugeridos(); const sg = ts.s;
  const hint = (k) => sg[k] ? `<span class="hint">Histórico: ${fmtN(sg[k].v)} d (últimas ${sg[k].n})</span>` : `<span class="hint" style="color:var(--muted)">Sem histórico · padrão ${fmtN(k === "frete" ? c.frete : c.tempos[k])} d</span>`;
  const dummy = planOne({ id: "_novo", qtd: c.combo, dataInicio: today(), tempos: ts, frete: ts.frete }, Object.fromEntries(itemsArr().map((i) => [i.id, Math.max(0, num(i.estoque))])), mont());
  return `<div class="head"><div><div class="eyebrow">Expansão</div><h1>Nova praça</h1><p class="lead">Cada praça nova recebe ${c.combo.MINI} máquinas Mini e ${c.combo.TECH} Tech. Ao solicitar, a fábrica confere o estoque, lista o que já tem e o que comprar, e calcula a entrega usando o tempo real das últimas máquinas.</p></div></div>
  <div class="grid g2">
    <div class="panel"><h2>Solicitar praça</h2>
      <form id="fpraca" style="margin-top:14px" class="grid">
        <div class="combo">${MODELS.map((m) => `<div class="unit"><span class="uimg" style="background-image:url('${MODEL_IMG[m].card}')"></span><span class="q">${c.combo[m]}×</span><div><b>${MODEL_NAME[m]}</b><div class="muted small">${brl(custoModelo(m).total)} cada</div></div></div>`).join("")}</div>
        <div class="row"><label class="f" style="flex:2">Cidade / praça<input id="np-cidade" required placeholder="Ex.: Cuiabá – MT"></label><label class="f" style="flex:2">Franqueado<input id="np-franq" placeholder="Nome do franqueado"></label></div>
        <div class="row"><label class="f" style="flex:1">Início da produção<input id="np-ini" type="date" value="${today()}"></label>${MODELS.map((m) => `<label class="f" style="flex:1">${MODEL_NAME[m]}<input id="np-q-${m}" type="number" min="0" step="1" value="${c.combo[m]}"></label>`).join("")}</div>
        <h3 style="margin-top:6px">Tempos de produção</h3>
        <div class="row"><label class="f" style="flex:1">Fabricar carcaça (dias/máquina)<input id="np-tc" type="number" min="0" step="0.5" value="${ts.carcaca}">${hint("carcaca")}</label><label class="f" style="flex:1">Montar eletrônica (dias/máquina)<input id="np-te" type="number" min="0" step="0.5" value="${ts.eletronica}">${hint("eletronica")}</label></div>
        <div class="row"><label class="f" style="flex:1">Montar a máquina (dias/máquina)<input id="np-tm" type="number" min="0" step="0.5" value="${ts.montagem}">${hint("montagem")}</label><label class="f" style="flex:1">Frete com case e acessórios (dias)<input id="np-fr" type="number" min="0" step="1" value="${ts.frete}">${hint("frete")}</label></div>
        <div class="row"><label class="f" style="flex:1">Máquinas produzidas ao mesmo tempo<input id="np-sim" type="number" min="1" step="1" value="${c.simult}"></label><label class="row small" style="flex:1;gap:6px;margin-top:16px"><input id="np-du" type="checkbox" ${c.diasUteis ? "checked" : ""}> Contar só dias úteis na produção</label></div>
        <button class="btn amb" type="submit">Solicitar e calcular</button>
      </form>
    </div>
    <div class="panel"><h2>Se pedisse hoje</h2><p class="muted small" style="margin:6px 0 14px">Simulação com o estoque atual e os tempos sugeridos pelo histórico, sem descontar reservas de outras praças.</p>
      <div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        <div class="stat"><div class="lbl">Itens em estoque</div><div class="val">${dummy.linhas.filter((l) => l.falta <= 0).length}</div></div>
        <div class="stat"><div class="lbl">Itens a comprar</div><div class="val">${dummy.comprar.length}</div><div class="sub">${brl(dummy.custoCompra)}</div></div>
        <div class="stat"><div class="lbl">Peças a fabricar</div><div class="val">${dummy.fabricar.length}</div></div>
        <div class="stat"><div class="lbl">Entrega estimada</div><div class="val">${fmtDs(dummy.entrega)}</div><div class="sub">${diffDays(today(), dummy.entrega)} dias a partir de hoje</div></div>
      </div>
      <div style="margin-top:18px;border-radius:var(--r);overflow:hidden;aspect-ratio:16/8;background:#0e171b url('https://static.wixstatic.com/media/42aab8_1877306c35064a69873601e32d748301~mv2.jpg') center 35%/cover;max-width:100%"></div>
    </div>
  </div>
  <div class="sec"><div class="sech"><h2>Praças solicitadas</h2></div>${tabela}</div>`;
}

function vPraca(id) {
  const adm = ADM(); const p = { id, ...S.pracas[id] }; const pl = allPlans()[id]; const st = STATUS_PRACA[p.status] || STATUS_PRACA.planejamento;
  const span = Math.max(1, diffDays(pl.inicio, pl.entrega));
  const pos = (d) => (Math.max(0, diffDays(pl.inicio, d)) / span) * 100;
  const pend = pl.comprar.filter((l) => !l.pedido);
  const ts = temposSugeridos();
  const lineRow = (l, mode) => `<tr><td class="ph">${thumb(l.it)}</td><td><span class="code muted">${esc(l.it.codigo)}</span><br>${esc(l.it.nome)}</td><td class="small">${esc(l.it.grupo)}</td><td class="n">${fmtN(l.need)}</td><td class="n">${fmtN(l.have)}</td>${mode === "est" ? "" : `<td class="n"><b>${fmtN(l.falta)}</b></td>`}${mode === "comprar" ? `<td class="n">${fmtN(l.it.prazo)} d</td><td>${fmtD(l.previsao)}${l.previsao === pl.chegada && pl.comprar.length ? ' <span class="pill p-warn">define a data</span>' : ""}</td>${adm ? `<td class="n">${brl(l.falta * num(l.it.custo))}</td><td>${l.pedido ? `<span class="pill ${l.pedidoStatus.includes("pedido") ? "p-warn" : "p-bad"}">${l.pedidoStatus.includes("pedido") ? "Pedido feito" : "A pedir"}</span>` : '<span class="pill p-neu">Sem pedido</span>'}</td><td>${l.it.link ? `<a class="lk small" target="_blank" rel="noopener" href="${esc(l.it.link)}">Comprar</a>` : ""}</td>` : ""}` : ""}${mode === "fab" ? `<td class="small">${esc(l.it.maq || "—")} ${l.it.mp ? `· <span class="code">${esc(l.it.mp)}</span>` : ""}</td>` : ""}</tr>`;
  const dis = adm ? "" : "disabled";
  const diffT = adm && ["carcaca", "eletronica", "montagem"].some((k) => ts.s[k] && ts.s[k].v !== pl.t[k]) || (adm && ts.s.frete && ts.s.frete.v !== pl.frete);
  return `<div class="head"><div><a class="lk small" href="#pracas">← Praças</a><h1 style="margin-top:8px">${esc(p.cidade)}</h1><p class="lead">${esc(p.franqueado || "Franqueado não informado")} · solicitada em ${fmtD(p.criadoEm?.slice(0, 10))} · <span class="pill ${st[1]}">${st[0]}</span></p></div>
  ${adm ? `<div class="row"><select id="pst" aria-label="Status">${Object.entries(STATUS_PRACA).map(([k, v]) => `<option value="${k}" ${p.status === k ? "selected" : ""}>${v[0]}</option>`).join("")}</select>${pend.length ? `<button class="btn amb" data-gerar="${id}">Gerar ${pend.length} pedidos de compra</button>` : ""}${!p.baixado ? `<button class="btn pri" data-baixa="${id}">Produção concluída: dar baixa</button>` : '<span class="pill p-ok">Estoque baixado</span>'}<button class="btn ghost danger" data-delpraca="${id}">Excluir</button></div>` : ""}</div>
  <div class="deliver"><div><div class="k">Entrega prevista no franqueado</div><div class="big">${fmtD(pl.entrega)}</div></div><div><div class="k">Todas as peças chegam</div><b>${fmtD(pl.chegada)}</b></div><div><div class="k">Prazo total</div><b>${diffDays(pl.inicio, pl.entrega)} dias</b></div>${adm ? `<div><div class="k">Investimento em máquinas</div><b>${brl(pl.custoTotal)}</b></div><div><div class="k">A comprar</div><b>${brl(pl.custoCompra)}</b></div>` : ""}${p.entregueEm ? `<div><div class="k">Entregue em</div><b>${fmtD(p.entregueEm)}</b></div>` : ""}</div>
  <div class="grid g2 sec">
    <div class="panel"><h3>O que a fábrica precisa entregar</h3>
      <div class="combo" style="margin-top:12px">${MODELS.map((m) => { const s = pl.steps[m]; return `<div class="unit"><span class="uimg" style="background-image:url('${MODEL_IMG[m].card}')"></span><span class="q">${s.n}×</span><div><b>${MODEL_NAME[m]}</b><div class="muted small">${s.prontas ? s.prontas + " pronta(s) do estoque · " : ""}${s.acabados ? s.acabados + " montada(s) do estoque · " : ""}${s.montar} a montar</div><div class="muted small">${Object.keys(CONJ).filter((k) => s.semiUsed[k]).map((k) => s.semiUsed[k] + "× " + CONJ[k].nome.replace("Conjunto ", "").toLowerCase() + " do estoque").join(" · ")}</div></div></div>`; }).join("")}</div>
      ${!pl.ativa ? `<p class="notice" style="margin-top:12px">Esta praça não reserva mais estoque (${esc(st[0].toLowerCase())}). Os números mostram a situação com o estoque atual.</p>` : ""}
    </div>
    <div class="panel"><h3>Tempos usados no cálculo</h3>
      <div class="row" style="margin-top:12px">
        <label class="f" style="flex:1">Carcaça (d/máq)<input id="pt-tc" type="number" min="0" step="0.5" value="${pl.t.carcaca}" ${dis}></label>
        <label class="f" style="flex:1">Eletrônica (d/máq)<input id="pt-te" type="number" min="0" step="0.5" value="${pl.t.eletronica}" ${dis}></label>
        <label class="f" style="flex:1">Montagem (d/máq)<input id="pt-tm" type="number" min="0" step="0.5" value="${pl.t.montagem}" ${dis}></label>
        <label class="f" style="flex:1">Frete (dias)<input id="pt-fr" type="number" min="0" step="1" value="${pl.frete}" ${dis}></label>
      </div>
      <div class="row" style="margin-top:10px"><label class="f" style="flex:1">Início<input id="pt-ini" type="date" value="${pl.inicio}" ${dis}></label><label class="f" style="flex:1">Simultâneas<input id="pt-sim" type="number" min="1" step="1" value="${pl.sim}" ${dis}></label><label class="row small" style="flex:1;gap:6px;margin-top:16px"><input id="pt-du" type="checkbox" ${pl.uteis ? "checked" : ""} ${dis}> Dias úteis</label></div>
      ${diffT ? `<div class="notice" style="margin-top:12px">O histórico sugere carcaça ${fmtN(ts.carcaca)} d, eletrônica ${fmtN(ts.eletronica)} d, montagem ${fmtN(ts.montagem)} d e frete ${fmtN(ts.frete)} d. <button class="btn sm" data-usarsug="${id}">Usar sugestão</button></div>` : ""}
      ${adm ? `<button class="btn pri" style="margin-top:12px" data-savetempos="${id}">Recalcular</button>` : ""}
    </div>
  </div>
  <div class="panel sec"><h3 style="margin-bottom:14px">Cronograma</h3>
    <div class="gantt">${pl.fases.map((f) => { const l = pos(f.ini), w = Math.max(pos(f.fim) - l, 0.8); return `<div class="lbl">${f.nome}<div class="muted small" style="font-weight:400">${fmtDs(f.ini)} → ${fmtDs(f.fim)}</div></div><div class="track"><div class="gseg" style="left:${l}%;width:${w}%;background:${f.cor}" title="${esc(f.info)}">${w > 14 ? esc(f.info) : ""}</div></div>`; }).join("")}
    <div class="axis"><span>${fmtD(pl.inicio)}</span><span>${fmtD(pl.entrega)}</span></div></div>
    <p class="muted small" style="margin-top:12px">A carcaça começa no início da produção. A eletrônica começa quando chega a última peça comprada. A montagem começa quando carcaça e eletrônica estão prontas. Prazos de compra em dias corridos.</p>
  </div>
  <div class="sec"><div class="sech"><h2>${adm ? "A comprar" : "Peças a chegar"} · ${pl.comprar.length} itens</h2></div>
  ${pl.comprar.length ? `<div class="tw"><table><thead><tr><th></th><th>Item</th><th>Grupo</th><th class="n">Precisa</th><th class="n">Tem</th><th class="n">${adm ? "Comprar" : "Falta"}</th><th class="n">Prazo</th><th>Chegada prevista</th>${adm ? '<th class="n">Valor</th><th>Pedido</th><th></th>' : ""}</tr></thead><tbody>${pl.comprar.sort((a, b) => b.previsao.localeCompare(a.previsao)).map((l) => lineRow(l, "comprar")).join("")}</tbody></table></div>` : `<div class="empty">Nada a comprar: o estoque cobre todas as peças prontas e acessórios.</div>`}</div>
  <div class="sec"><div class="sech"><h2>A fabricar · ${pl.fabricar.length} peças</h2></div>
  ${pl.fabricar.length ? `<div class="tw"><table><thead><tr><th></th><th>Peça</th><th>Grupo</th><th class="n">Precisa</th><th class="n">Tem</th><th class="n">Fabricar</th><th>Maquinário · MP</th></tr></thead><tbody>${pl.fabricar.map((l) => lineRow(l, "fab")).join("")}</tbody></table></div>` : `<div class="empty">Nenhuma peça a fabricar.</div>`}</div>
  <div class="sec"><div class="sech"><h2>Já em estoque · ${pl.estoque.length} itens</h2></div>
  ${pl.estoque.length ? `<div class="tw"><table><thead><tr><th></th><th>Item</th><th>Grupo</th><th class="n">Precisa</th><th class="n">Reservado</th></tr></thead><tbody>${pl.estoque.map((l) => lineRow(l, "est")).join("")}</tbody></table></div>` : `<div class="empty">Nenhum item desta praça está em estoque ainda.</div>`}</div>`;
}

const TITULO_COL = ["Item", "Peça", "Praça", "Falha", "Descrição", "Código"];
function cardify(raiz) {
  if (!raiz) return;
  raiz.querySelectorAll(".tw").forEach((tw) => {
    const t = tw.querySelector("table"); if (!t) return;
    const ths = [...t.querySelectorAll("thead th")].map((th) => th.textContent.trim());
    if (!ths.length) return;
    tw.classList.add("cardify");
    let titulo = -1; for (const n of TITULO_COL) { const i = ths.indexOf(n); if (i >= 0) { titulo = i; break; } }
    t.querySelectorAll("tbody tr").forEach((tr) => {
      [...tr.children].forEach((td, i) => { td.setAttribute("data-l", ths[i] || ""); if (i === titulo) td.classList.add("tt"); });
      if (tr.querySelector("td.ph .thumb")) tr.classList.add("comfoto");
    });
  });
}

async function saveItem(form) {
  const id = form.dataset.id || null; const g = (k) => $("#it-" + k).value.trim();
  const nums = ["custo", "qtdMini", "qtdTech", "estoque", "minimo", "prazo", "precoAvulso"];
  const all = {};
  for (const k of ["codigo", "tipo", "nome", "grupo", "conjunto", "local", "fornecedor", "link", "qgRef", "dim", "mp", "maq", "params", "obs", ...nums]) all[k] = nums.includes(k) ? num(g(k)) : g(k);
  if (!all.codigo) { toast("Informe o código do item.", true); return; }
  if (all.link && !/^https?:\/\//i.test(all.link)) all.link = "https://" + all.link;
  const pub = { ...(id ? S.itens[id] : { origem: "Manual" }) }; for (const [k, v] of Object.entries(all)) if (!PRECO_KEYS.includes(k)) pub[k] = v;
  for (const k of PRECO_KEYS) delete pub[k];
  const prevE = id ? num(S.itens[id].estoque) : 0;
  const btn = $("#it-save"); if (btn) btn.disabled = true;
  if (pendingFoto && S.assets) {
    try { const r = await S.assets.upload(pendingFoto); pub.foto = r.url; }
    catch (e) { toast(e && e.code === "too_large" ? "A foto passa do limite de 20 MB." : e && e.code === "unsupported_type" ? "Formato de imagem não suportado." : "Não foi possível enviar a foto.", true); if (btn) btn.disabled = false; return; }
  }
  const ok = await guard(async () => {
    const slug = all.codigo.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const ref = id ? S.db.collection("itens").doc(id) : (slug && !S.itens[slug] ? S.db.collection("itens").doc(slug) : S.db.collection("itens").doc());
    await ref.set(pub);
    await savePreco(ref.id, all.custo, id ? "Edição" : "Cadastro", { precoAvulso: all.precoAvulso, link: all.link, fornecedor: all.fornecedor });

async function moveStock(id, tipo, q, motivo, extra = {}) {
  const it = S.itens[id]; const atual = num(it.estoque);
  const novo = tipo === "entrada" ? atual + q : tipo === "saida" ? atual - q : q;
  // Servidor novo soma a entrada ou saída ao saldo que está na base, sem sobrescrever o lançamento de outra pessoa
  const inc = SERVIDOR.v >= 2 && tipo !== "ajuste";
  await S.db.collection("itens").doc(id).update(inc ? { estoque: { $inc: tipo === "entrada" ? q : -q } } : { estoque: novo });
  await S.db.collection("movs").add({ itemId: id, tipo, qtd: q, data: today(), ts: new Date().toISOString(), motivo: motivo || "", ...extra });
  if (!inc) S.itens[id] = { ...it, estoque: novo };
}
async function setMont(m, k, v) { const cur = mont(); cur[m][k] = Math.max(0, v); await S.db.collection("config").doc("montagem").set(cur); S.mont = cur; }
function produce(m, k) {
  const ms = mont(); const its = itemsArr(); const consume = []; const semis = [];
  if (CONJ[k]) its.filter((i) => i.tipo !== "acessorio" && i.conjunto === k && qtyOf(i, m)).forEach((i) => consume.push([i, qtyOf(i, m)]));
  else if (k === "acabado") { semis.push(...Object.keys(CONJ)); its.filter((i) => i.tipo !== "acessorio" && !CONJ[i.conjunto] && qtyOf(i, m)).forEach((i) => consume.push([i, qtyOf(i, m)])); }
  else if (k === "maquina") { semis.push("acabado"); its.filter((i) => i.tipo === "acessorio" && qtyOf(i, m)).forEach((i) => consume.push([i, qtyOf(i, m)])); }
  const faltaI = consume.filter(([i, q]) => num(i.estoque) < q); const faltaS = semis.filter((s) => (ms[m][s] || 0) < 1);
  const label = k === "maquina" ? "máquina completa" : k === "acabado" ? "produto acabado" : CONJ[k].nome.toLowerCase();
  const nomeS = (s) => s === "acabado" ? "produto acabado" : CONJ[s].nome;
  const warn = (faltaI.length || faltaS.length) ? `<br><br><b style="color:var(--bad)">Falta no estoque:</b> ${[...faltaS.map(nomeS), ...faltaI.map(([i, q]) => esc(i.codigo) + " (tem " + fmtN(i.estoque) + ", precisa " + fmtN(q) + ")")].join(", ")}. Os saldos ficarão negativos.` : "";
  const cat = CATEG[k]; const ts = temposSugeridos();
  const extra = `<div class="fg"><label class="f">Dias de trabalho nesta etapa<input id="pd-dias" type="number" min="0" step="0.5" value="${cat ? ts[cat] : ""}" placeholder="ex.: 1,5">${cat ? `<span class="hint">Entra no cálculo de prazo de ${CATEG_NOME[cat].toLowerCase()}</span>` : ""}</label><label class="f">Data de conclusão<input id="pd-data" type="date" value="${today()}"></label></div>`;
  confirmDrawer("Produzir 1 " + label + " · " + MODEL_NAME[m], `Vai dar baixa em ${consume.length} itens${semis.length ? " e em " + semis.length + " semiacabado(s)" : ""} e somar 1 ${label} ao estoque.${warn}`, "Confirmar produção", async () => {
    const dias = num($("#pd-dias") && $("#pd-dias").value); const data = ($("#pd-data") && $("#pd-data").value) || today();
    await guard(async () => {
      for (const [i, q] of consume) await moveStock(i.id, "saida", q, "Produção: " + label + " " + m);
      const cur = mont(); for (const s of semis) cur[m][s] = (cur[m][s] || 0) - 1; cur[m][k] = (cur[m][k] || 0) + 1;
      await S.db.collection("config").doc("montagem").set(cur); S.mont = cur;
      const uid = S.user && S.user.id ? await S.user.id().catch(() => null) : null;
      await S.db.collection("producao").add({ modelo: m, etapa: k, categoria: cat || "", dias, data, ts: new Date().toISOString(), por: uid || "" });
    }, "Produção registrada");
  }, extra);
}
async function gerarPedidos(pid) {
  const pl = allPlans()[pid]; const pend = pl.comprar.filter((l) => !l.pedido);
  await guard(async () => {
    for (const l of pend) await S.db.collection("compras").add({ itemId: l.id, qtd: l.falta, custoUnit: num(l.it.custo), status: "pendente", pracaId: pid, prazo: num(l.it.prazo), previsao: addDays(pl.inicio, num(l.it.prazo), false), link: l.it.link || "", criadoEm: new Date().toISOString() });
    if ((S.pracas[pid].status || "planejamento") === "planejamento") await S.db.collection("pracas").doc(pid).update({ status: "compras" });

function baixaPraca(pid) {
  const pl = allPlans()[pid]; const p = S.pracas[pid];
  const faltam = pl.linhas.filter((l) => l.falta > 0);
  confirmDrawer("Dar baixa da praça " + p.cidade, `Registra a saída de ${pl.linhas.length} itens do estoque e das máquinas e semiacabados reservados, e marca a praça como expedida hoje.${faltam.length ? `<br><br><b style="color:var(--bad)">${faltam.length} itens ainda não estão em estoque</b>; os saldos deles ficarão negativos.` : ""}`, "Dar baixa", () => guard(async () => {
    for (const l of pl.linhas) await moveStock(l.id, "saida", l.need, "Praça " + p.cidade);

    for (const m of MODELS) { const s = pl.steps[m]; cur[m].maquina -= s.prontas; cur[m].acabado -= s.acabados; for (const k of Object.keys(CONJ)) cur[m][k] = (cur[m][k] || 0) - s.semiUsed[k]; }
    await S.db.collection("config").doc("montagem").set(cur);
    await S.db.collection("pracas").doc(pid).update({ baixado: true, status: "expedida", expedidaEm: today() });

}

let TOKEN = null, reqSeq = 0; const pend = {};
function rpc(op, ...args) {
  return new Promise((res, rej) => {
    const id = ++reqSeq; pend[id] = { res, rej };
    window.parent.postMessage({ qg: 1, id, op, args, token: TOKEN }, "*");
    setTimeout(() => { if (pend[id]) { delete pend[id]; rej({ code: "unavailable", message: "Sem resposta do site" }); } }, op === "google" ? 300000 : 30000);
  });
}
window.addEventListener("message", (e) => {
  const d = e.data; if (!d || !d.qg || d.op || !pend[d.id]) return;
  const p = pend[d.id]; delete pend[d.id];
  d.ok ? p.res(d.res) : p.rej({ code: d.code || "erro", message: d.err || "" });
});
// Base local espelhando as coleções, com assinaturas no mesmo formato usado pelo app
const BASE = {}; const ouvintes = [];
const docSnap = (c, id) => ({ id, exists: !!(BASE[c] && BASE[c][id]), data: () => BASE[c] && BASE[c][id] });
function avisar(c) { ouvintes.filter((o) => o.c === c).forEach((o) => o.fn()); }
function consulta(c, ord, lim) {
  const q = {
    orderBy: (f, dir) => consulta(c, [f, dir || "asc"], lim),
    limit: (n) => consulta(c, ord, n),
    onSnapshot: (next) => {
      const fn = () => {
        let docs = Object.keys(BASE[c] || {}).map((id) => docSnap(c, id));
        if (ord) docs.sort((a, b) => { const x = a.data()[ord[0]], y = b.data()[ord[0]]; return (x > y ? 1 : x < y ? -1 : 0) * (ord[1] === "desc" ? -1 : 1); });
        if (lim) docs = docs.slice(0, lim);
        next({ docs, size: docs.length, empty: !docs.length });
      };
      const o = { c, fn }; ouvintes.push(o); setTimeout(fn, 0);
      return () => { const i = ouvintes.indexOf(o); if (i >= 0) ouvintes.splice(i, 1); };
    },
    doc: (id) => refDoc(c, id || ("d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7))),
    add: async (dados) => { const r = refDoc(c, "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7)); await r.set(dados); return r; },
  };
  return q;
}
function refDoc(c, id) {
  return {
    id,
    set: async (dados) => { await rpc("salvar", c, id, dados); (BASE[c] = BASE[c] || {})[id] = JSON.parse(JSON.stringify(dados)); avisar(c); },
    update: async (patch) => { const r = await rpc("atualizar", c, id, patch); BASE[c] = BASE[c] || {}; BASE[c][id] = r && typeof r === "object" && r.dados ? r.dados : { ...(BASE[c][id] || {}), ...JSON.parse(JSON.stringify(patch)) }; avisar(c); },
    delete: async () => { await rpc("excluir", c, id); if (BASE[c]) delete BASE[c][id]; avisar(c); },
    onSnapshot: (next) => { const fn = () => next(docSnap(c, id)); const o = { c, fn }; ouvintes.push(o); setTimeout(fn, 0); return () => { const i = ouvintes.indexOf(o); if (i >= 0) ouvintes.splice(i, 1); }; },
  };
}
const DB = { collection: (c) => consulta(c), doc: (p) => { const [c, id] = p.split("/"); return refDoc(c, id); } };
const SERVIDOR = { v: 1 };
async function recarregar() {
  const tudo = await rpc("carregar");
  SERVIDOR.v = (tudo && tudo.__servidor && tudo.__servidor.v) || 1; if (tudo) delete tudo.__servidor;
  for (const c of Object.keys(BASE)) if (!tudo[c]) BASE[c] = {};
  for (const [c, docs] of Object.entries(tudo)) BASE[c] = docs;
  Object.keys(BASE).forEach(avisar);
}
function showGate(msg) {
  document.body.classList.add("locked");
  $("#gate").hidden = false; $("#gate-msg").textContent = msg || ""; $("#gate-pw").value = "";
  setTimeout(() => $("#gate-pw").focus(), 30);
}
let assinado = false, poll = 0;
function assinarTudo() {
  if (assinado) return; assinado = true;
  const db = DB;
  db.collection("itens").onSnapshot((sn) => { const o = {}; sn.docs.forEach((d) => (o[d.id] = d.data())); S.itens = o; S.loaded.itens = true; schedule(); });
  db.doc("config/montagem").onSnapshot((d) => { S.mont = d.exists ? d.data() : null; schedule(); });
  db.collection("pracas").onSnapshot((sn) => { const o = {}; sn.docs.forEach((d) => (o[d.id] = d.data())); S.pracas = o; schedule(); });
  db.doc("arquivos/lista").onSnapshot((d) => { S.arquivos = d.exists ? d.data() : null; schedule(); });
  db.collection("producao").orderBy("ts", "desc").limit(200).onSnapshot((sn) => { S.producao = sn.docs.map((d) => ({ id: d.id, ...d.data() })); schedule(); });
  db.collection("movs").orderBy("ts", "desc").limit(60).onSnapshot((sn) => { S.movs = sn.docs.map((d) => ({ id: d.id, ...d.data() })); schedule(); });
  db.collection("precos").onSnapshot((sn) => { const o = {}; sn.docs.forEach((d) => (o[d.id] = d.data())); S.precos = o; schedule(); });
  db.doc("config/geral").onSnapshot((d) => { S.cfg = d.exists ? d.data() : null; schedule(); });
  db.collection("compras").onSnapshot((sn) => { const o = {}; sn.docs.forEach((d) => (o[d.id] = d.data())); S.compras = o; schedule(); });
  db.collection("links").onSnapshot((sn) => { const o = {}; sn.docs.forEach((d) => (o[d.id] = d.data())); S.links = o; schedule(); });
  db.collection("frota_unidades").onSnapshot((sn) => { const o = {}; sn.docs.forEach((d) => (o[d.id] = d.data())); S.fu = o; schedule(); });
  db.collection("frota_maquinas").onSnapshot((sn) => { const o = {}; sn.docs.forEach((d) => (o[d.id] = d.data())); S.fm = o; schedule(); });
  db.collection("usuarios").onSnapshot((sn) => { const o = {}; sn.docs.forEach((d) => (o[d.id] = d.data())); S.usuarios = o; schedule(); });
}
async function entrar(role, info) {
  S.role = role; S.canWrite = true; S.db = DB; S.conta = info && info.email ? { email: info.email, nome: info.nome || "" } : null;
  S.user = { id: async () => (S.conta ? S.conta.email : role) };
  $("#who").textContent = S.conta ? (S.conta.nome || S.conta.email) : "";
  S.assets = null;
  $("#role").hidden = false; $("#role").textContent = ROLE_NAME[S.role]; $("#sair").hidden = false;
  document.body.classList.remove("locked"); $("#gate").hidden = true; $("#gate-msg").textContent = "";
  assinarTudo();
  await recarregar();
  clearInterval(poll); poll = setInterval(() => { if (!document.hidden && TOKEN) recarregar().catch(() => {}); }, 45000);
  if (!location.hash) location.hash = "#inicio"; route();
}
function lock() {
  if (S.conta) rpc("sairConta").catch(() => {});
  S.conta = null; $("#who").textContent = "";
  TOKEN = null; clearInterval(poll); try { sessionStorage.removeItem("qg-token"); } catch (_) {}
  for (const c of Object.keys(BASE)) BASE[c] = {}; Object.keys(BASE).forEach(avisar);
  S.role = "leitura"; S.canWrite = false; closeLayer(); $("#view").innerHTML = "";
  $("#role").hidden = true; $("#sair").hidden = true; showGate("Sessão encerrada.");
}
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "fgate") return;
  e.preventDefault();
  const pw = $("#gate-pw").value.trim(); if (!pw) { $("#gate-msg").textContent = "Digite a senha."; return; }
  const btn = e.target.querySelector("button"); btn.disabled = true; $("#gate-msg").textContent = "Entrando…";
  try {
    const r = await rpc("entrar", pw);
    TOKEN = r.token; try { sessionStorage.setItem("qg-token", JSON.stringify(r)); } catch (_) {}
    await entrar(r.perfil, r);
  } catch (err) { $("#gate-msg").textContent = err && err.code === "senha" ? "Senha incorreta." : err && err.code === "bloqueado" ? "Muitas tentativas. Aguarde um minuto." : "Não foi possível entrar agora. Tente de novo."; }
  btn.disabled = false;
}, true);
document.addEventListener("click", (e) => { if (e.target.closest("#sair")) lock(); });
document.addEventListener("click", async (e) => {
  if (!e.target.closest("#gate-google")) return;
  const b = $("#gate-google"); b.disabled = true; $("#gate-msg").textContent = "Abrindo o login do Google…";
  try {
    const r = await rpc("google");
    TOKEN = r.token; try { sessionStorage.setItem("qg-token", JSON.stringify(r)); } catch (_) {}
    await entrar(r.perfil, r);
  } catch (err) {
    const c = err && err.code, msg = String((err && err.message) || "");
    $("#gate-msg").textContent = c === "naocadastrado" ? `O e-mail ${msg.split(":")[1] || ""} não está cadastrado. Peça a um administrador para incluir você em Usuários.`
      : c === "cancelado" ? "Login cancelado." : /desconhecida/i.test(msg) ? "O login com Google ainda não foi ligado no site." : "Não foi possível entrar com o Google agora. Tente de novo.";
  }
  b.disabled = false;
});
async function boot() {
  try { const md = localStorage.getItem("qg-modo"); if (md === "cards" || md === "tabela") UI.modo = md; } catch (_) {}
  showGate();
  let salvo = null; try { salvo = JSON.parse(sessionStorage.getItem("qg-token") || "null"); } catch (_) {}
  if (salvo && salvo.token && salvo.exp > Date.now()) { TOKEN = salvo.token; try { await entrar(salvo.perfil, salvo); } catch (_) { lock(); } }
}

boot();
})();
